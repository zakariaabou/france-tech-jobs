name: Update job listings

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/update-jobs.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: job-listings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Install linter
        run: python -m pip install ruff==0.16.3
      - name: Lint for errors
        run: python -m ruff check --select E9,F63,F7,F82 src tests
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and render jobs
        run: python -m france_tech_jobs
        env:
          PYTHONPATH: src
      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json jobs/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh job listings'
            git push
          fi
